<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STEVE CAM roughing</title>
<link rel="stylesheet" href="panel.css">
</head>
<body>
<header>
  <h1>Adaptive roughing</h1>
  <span id="engine-state" class="pill idle">idle</span>
</header>

<main>
  <section id="doc-line">No open document.</section>

  <form id="rough-form" autocomplete="off">
    <div class="grid">
      <label>Orientation
        <select name="orientation">
          <option value="as_modeled" selected>As modeled</option>
          <option value="flip_x_180">Flip X 180</option>
          <option value="flip_y_180">Flip Y 180</option>
          <option value="flip_z_180">Flip Z 180</option>
        </select>
      </label>
      <label>Tool
        <select name="tool_type">
          <option value="bull" selected>Bull</option>
          <option value="flat">Flat</option>
          <option value="ball">Ball</option>
        </select>
      </label>
      <label>Dia (mm)<input name="tool_diameter" type="number" step="0.1"
        min="1" max="32" value="12.7"></label>
      <label>Corner R (mm)<input name="corner_radius" type="number"
        step="0.001" min="0" max="8" value="0.127"></label>
      <label>Stock XY (mm)<input name="stock_xy" type="number" step="0.1"
        min="0" max="25.4" value="1"></label>
      <label>Stock top (mm)<input name="stock_top" type="number" step="0.1"
        min="0" max="25.4" value="1"></label>
      <label>Stock bottom (mm)<input name="stock_bottom" type="number"
        step="0.1" min="0" max="25.4" value="1"></label>
      <label>Floor Z (mm)<input name="floor_z" type="number" step="0.1"
        min="0" max="200" value="0"></label>
      <label>Stepdown (mm)<input name="stepdown" type="number" step="0.1"
        min="0.1" max="25.4" value="19.05"></label>
      <label>Optimal load (mm)<input name="optimal_load" type="number"
        step="0.1" min="0.05" max="10" value="2.03"></label>
      <label>Leave (mm)<input name="stock_to_leave" type="number"
        step="0.01" min="0" max="5" value="0.381"></label>
      <label>RPM<input name="rpm" type="number" step="100" min="100"
        max="30000" value="7500"></label>
      <label>Feed (mm/min)<input name="feed" type="number" step="10"
        min="10" max="20000" value="3429"></label>
      <label>Units
        <select name="units">
          <option value="inch" selected>Inch</option>
          <option value="mm">mm</option>
        </select>
      </label>
    </div>
    <button id="rough-open" type="submit" disabled>
      Rough the open document
    </button>
  </form>

  <section id="run-card" class="hidden">
    <div class="run-head">
      <strong id="run-state">…</strong>
      <button id="cancel-btn" type="button">Cancel</button>
    </div>
    <progress id="run-progress" max="1" value="0"></progress>
    <div id="run-message"></div>
    <pre id="run-summary" class="hidden"></pre>
    <img id="run-preview" class="hidden" alt="leftover preview">
  </section>

  <section id="events"></section>
</main>

<script src="panel.js"></script>
</body>
</html>
